                {holidays.length > 3 && (
                  <button className="sp-mini" onClick={() => setShowAllHolidays((v) => !v)} style={{ marginTop: 4, border: "none", padding: "2px 0", background: "transparent", color: C.muted, fontStyle: "italic" }}>
                    {showAllHolidays ? "weniger anzeigen" : `+${holidays.length - 3} weitere anzeigen`}
                  </button>
                )}
              </div>
            )}
            <input type="file" accept=".ics,text/calendar" ref={holidayFileRef} onChange={onHolidayFile} style={{ display: "none" }} aria-hidden />

            <button
              className="sp-btn"
              onClick={doIcalExport}
              disabled={scheduledStudentCount + scheduledEnsembleCount === 0}
              style={{ opacity: scheduledStudentCount + scheduledEnsembleCount === 0 ? 0.5 : 1, fontWeight: 600 }}
              title={scheduledStudentCount + scheduledEnsembleCount === 0 ? "Keine eingeplanten SchülerInnen oder Ensembles" : "Kalenderdatei erstellen"}
            >
              Kalender-Datei (.ics) erstellen
            </button>
            {icalMsg && (
              <div style={{
                fontSize: 11,
                marginTop: 6,
                color: icalMsg.ok ? PREF.bg : C.danger,
                padding: icalMsg.ok ? "0" : "4px 8px",
                background: icalMsg.ok ? "transparent" : C.dangerSoft,
                borderRadius: 4,
              }}>
                {icalMsg.text}
              </div>
            )}
            <div style={{ fontSize: 11, color: C.muted, marginTop: 6 }}>
              Wöchentliche Wiederholung pro SchülerIn bis Schuljahresende. In Google Kalender: Einstellungen ▸ Importieren und exportieren ▸ Datei auswählen.
            </div>

            <div style={{ marginTop: 18 }}>
              {confirmReset ? (
                <span style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{ color: C.danger }}>Alle SchülerInnen und Pausen löschen?</span>
                  <button className="sp-btn" style={{ color: C.danger }} onClick={() => { setItems([]); setExpandedId(null); setConfirmReset(false); }}>Ja, löschen</button>
                  <button className="sp-btn" onClick={() => setConfirmReset(false)}>Abbrechen</button>
                </span>
              ) : (
                <button className="sp-btn" style={{ color: C.muted }} onClick={() => setConfirmReset(true)}>Alles zurücksetzen</button>
              )}
            </div>
          </section>
        </aside>

        <main className="sp-main">
          {focused && !isPause(focused) && ((focused.blocked || []).length > 0 || (focused.preferred || []).length > 0) && (
            <div style={{ display: "flex", gap: 14, alignItems: "center", fontSize: 12, color: C.muted, marginBottom: 8, padding: "0 4px", flexWrap: "wrap" }}>
              <span>Verfügbarkeit von <strong style={{ color: C.ink }}>{focused.name}</strong>:</span>
              {(focused.blocked || []).length > 0 && (
                <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                  <span style={{ width: 14, height: 10, background: "repeating-linear-gradient(135deg, rgba(178,58,58,0.20) 0 4px, transparent 4px 8px)", border: `1px solid rgba(178,58,58,0.35)` }} />
                  Sperrzeit
                </span>
              )}
              {(focused.preferred || []).length > 0 && (
                <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                  <span style={{ width: 14, height: 10, background: "rgba(63,122,61,0.12)", borderLeft: `3px solid ${PREF.bg}` }} />
                  Wunschzeit
                </span>
              )}
            </div>
          )}

          <div style={{ background: C.paper, border: `1px solid ${C.border}`, borderRadius: 10, overflowX: "auto" }}>
            <div style={{ minWidth: 64 + dayCount * 120 }}>
              <div style={{ display: "grid", gridTemplateColumns: `56px repeat(${dayCount}, 1fr)`, borderBottom: `1px solid ${C.line60}` }}>
                <div />
                {visibleDays.map((i) => {
                  const students = items.filter((s) => s.day === i && s.type === "student");
                  const ensembles = items.filter((s) => s.day === i && s.type === "ensemble");
                  const totalCount = students.length + ensembles.length;
                  const totalMins = students.reduce((a, s) => a + s.duration, 0) + ensembles.reduce((a, s) => a + s.duration, 0);
                  return (
                    <div key={i} style={{ padding: "10px 8px 8px", borderLeft: `1px solid ${C.line30}` }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{DAY_NAMES[i]}</div>
                      {totalCount === 0 ? (
                        <div style={{ fontSize: 11, color: C.muted }}>frei</div>
                      ) : (
                        <>
                          <div style={{ fontSize: 11, color: C.muted }}>
                            {totalCount} {totalCount === 1 ? "Einheit" : "Einheiten"}
                          </div>
                          <div style={{ fontSize: 11, color: C.muted, fontFamily: MONO, fontVariantNumeric: "tabular-nums" }}>
                            {fmtDur(totalMins)}
                          </div>
                          {ensembles.length > 0 && (
                            <div style={{ fontSize: 11, color: ENSEMBLE.bg, marginTop: 2 }}>
                              davon {ensembles.length} Ensemble{ensembles.length === 1 ? "" : "s"}
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  );
                })}
              </div>

              <div style={{ display: "grid", gridTemplateColumns: `56px repeat(${dayCount}, 1fr)`, padding: "12px 0 14px" }}>
                <div style={{ position: "relative", height: total * PX }}>
                  {Array.from({ length: settings.endHour - settings.startHour + 1 }, (_, i) => {
                    const h = settings.startHour + i;
                    return (
                      <div key={h} style={{ position: "absolute", right: 8, top: (h * 60 - startMin) * PX, transform: "translateY(-50%)", fontSize: 11, color: C.muted, fontFamily: MONO, fontVariantNumeric: "tabular-nums" }}>
                        {String(h).padStart(2, "0")}:00
                      </div>
                    );
                  })}
                </div>

                {visibleDays.map((i) => (
                  <div
                    key={i}
                    ref={(el) => (colRefs.current[i] = el)}
                    style={{
                      position: "relative",
                      height: total * PX,
                      borderLeft: `1px solid ${C.line30}`,
                      backgroundImage: [
                        `repeating-linear-gradient(to bottom, ${C.line60} 0 1px, transparent 1px ${60 * PX}px)`,
                        `repeating-linear-gradient(to bottom, ${C.line30} 0 1px, transparent 1px ${30 * PX}px)`,
                        `repeating-linear-gradient(to bottom, ${C.line10} 0 1px, transparent 1px ${10 * PX}px)`,
                      ].join(","),
                      backgroundColor: drag && drag.day === i
                        ? (drag.valid ? (drag.preferred ? "#EDF3EB" : "#F6F8F5") : "#FBF3F3")
                        : "transparent",
                    }}
                  >
                    {focused && !isPause(focused) && (focused.preferred || []).filter((p) => p.day === i).map((p, k) => {
                      const top = Math.max(0, (Math.max(startMin, p.from) - startMin) * PX);
                      const height = (Math.min(endMin, p.to) - Math.max(startMin, p.from)) * PX;
                      if (height <= 0) return null;
                      return (
                        <div key={"pref-" + k} style={{ position: "absolute", left: 0, right: 0, top, height, background: "rgba(63,122,61,0.10)", borderLeft: `3px solid ${PREF.bg}`, pointerEvents: "none", zIndex: 1 }} />
                      );
                    })}
                    {focused && !isPause(focused) && (focused.blocked || []).filter((b) => b.day === i).map((b, k) => {
                      const top = Math.max(0, (Math.max(startMin, b.from) - startMin) * PX);
                      const height = (Math.min(endMin, b.to) - Math.max(startMin, b.from)) * PX;
                      if (height <= 0) return null;
                      return (
                        <div key={"blk-" + k} style={{ position: "absolute", left: 0, right: 0, top, height, background: "repeating-linear-gradient(135deg, rgba(178,58,58,0.18) 0 4px, transparent 4px 10px)", borderTop: `1px solid rgba(178,58,58,0.35)`, borderBottom: `1px solid rgba(178,58,58,0.35)`, pointerEvents: "none", zIndex: 2 }} />
                      );
                    })}

                    {gaps[i] && gaps[i].map((g, k) => {
                      const height = g.duration * PX;
                      if (height < 12) return null;
                      return (
                        <div key={"gap-" + k} style={{
                          position: "absolute",
                          left: 0, right: 0,
                          top: (g.start - startMin) * PX,
                          height: height,
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          pointerEvents: "none",
                          zIndex: 1,
                          color: C.muted,
                          fontSize: 10,
                          fontFamily: MONO,
                          fontVariantNumeric: "tabular-nums",
                          opacity: 0.7,
                        }}>
                          {g.duration} min
                        </div>
                      );
                    })}

                    {items.filter((s) => s.day === i).map((s) => {
                      const info = layouts[i].get(s.id) || { col: 0, totalCols: 1 };
                      const col = info.col, totalCols = info.totalCols;
                      const isNarrow = totalCols > 1;
                      const blockHeight = s.duration * PX;
                      const isTiny = blockHeight < 32 && !isPause(s);
                      const isTinyPause = isPause(s) && blockHeight < 22;
                      const isVeryTinyPause = isPause(s) && blockHeight < 12;
                      const outer = 4, halfGap = 2;
                      const leftPct = (col / totalCols) * 100;
                      const rightPct = ((totalCols - col - 1) / totalCols) * 100;
                      return (
                        <div
                          key={s.id}
                          className={"sp-block" + (isPause(s) ? " pause" : "")}
                          title={s.type === "student" ? undefined : `${s.name} · ${fmt(s.start)}–${fmt(s.start + s.duration)}`}
                          {...dragProps(s, true)}
                          onMouseEnter={s.type === "student" ? (e) => {
                            if (dragRef.current) return;
                            const rect = e.currentTarget.getBoundingClientRect();
                            const popupWidth = 280;
                            const overflowsRight = rect.right + 10 + popupWidth > window.innerWidth;
                            const x = overflowsRight ? Math.max(10, rect.left - popupWidth - 10) : rect.right + 10;
                            const y = Math.max(10, Math.min(rect.top, window.innerHeight - 250));
                            setBlockHover({ id: s.id, x, y });
                          } : undefined}
                          onMouseLeave={s.type === "student" ? () => setBlockHover(null) : undefined}
                          style={Object.assign({}, dragStyle, {
                            top: (s.start - startMin) * PX + 1,
                            height: s.duration * PX - 2,
                            left: `calc(${leftPct}% + ${col === 0 ? outer : halfGap}px)`,
                            right: `calc(${rightPct}% + ${col === totalCols - 1 ? outer : halfGap}px)`,
                            background: isPause(s) ? undefined : colorOf(s).bg,
                            opacity: drag && drag.id === s.id ? 0.3 : 1,
                          }, isVeryTinyPause ? { padding: 0 } : (isTinyPause ? { padding: "0 6px" } : (isTiny ? { padding: "1px 6px" } : {})))}
                        >
                          {isPause(s) ? (
                            isVeryTinyPause ? null : (
                              <div style={{ fontSize: isTinyPause ? 9 : 10, fontFamily: MONO, lineHeight: 1.1, whiteSpace: "nowrap", overflow: "hidden" }}>
                                {isNarrow || isTinyPause ? `${s.duration}m` : `Pause · ${s.duration} min`}
                              </div>
                            )
                          ) : isTiny ? (
                            <div style={{
                              fontSize: 11, fontWeight: 600, lineHeight: 1,
                              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                              display: "flex", alignItems: "center", gap: 5, height: "100%",
                            }}>
                              <span style={{ fontFamily: MONO, opacity: 0.85, fontWeight: 500, fontSize: 10, flexShrink: 0 }}>{fmt(s.start)}</span>
                              <span style={{ overflow: "hidden", textOverflow: "ellipsis", flex: 1, minWidth: 0 }}>{s.name}</span>
                              {isEnsemble(s) && (s.dates || []).length > 0 && !isNarrow && (
                                <span style={{ fontFamily: MONO, opacity: 0.85, fontSize: 9, flexShrink: 0 }}>· {(s.dates || []).length}T</span>
                              )}
                            </div>
                          ) : isEnsemble(s) ? (
                            <>
                              <div style={{ fontSize: 12, fontWeight: 600, lineHeight: 1.2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name}</div>
                              <div style={{ fontSize: 10, opacity: 0.85, fontFamily: MONO, lineHeight: 1.2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                                {isNarrow ? `${fmt(s.start)} · ${(s.dates || []).length}T` : `${fmt(s.start)}–${fmt(s.start + s.duration)} · ${(s.dates || []).length} Termin${(s.dates || []).length === 1 ? "" : "e"}`}
                              </div>
                            </>
                          ) : (
                            <>
                              <div style={{ fontSize: 12, fontWeight: 600, lineHeight: 1.2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.name}</div>
                              <div style={{ fontSize: 10, opacity: 0.85, fontFamily: MONO, lineHeight: 1.2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                                {isNarrow ? `${fmt(s.start)} · ${s.duration}m` : `${fmt(s.start)}–${fmt(s.start + s.duration)} · ${s.duration} min`}
                              </div>
                            </>
                          )}
                        </div>
                      );
                    })}

                    {zones[i] && zones[i].map((z, k) => (
                      <div key={"gr-" + k} style={{
                        position: "absolute", left: 0, right: 0,
                        top: (z.start - startMin) * PX,
                        height: (z.end - z.start) * PX,
                        background: "repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0 3px, transparent 3px 9px)",
                        borderTop: "1px dashed rgba(0,0,0,0.3)",
                        borderBottom: "1px dashed rgba(0,0,0,0.3)",
                        pointerEvents: "none", zIndex: 5,
                      }} />
                    ))}

                    {drag && drag.day === i && dragged && (
                      <div
                        style={{
                          position: "absolute", left: 4, right: 4, pointerEvents: "none", boxSizing: "border-box",
                          top: (drag.start - startMin) * PX + 1,
                          height: dragged.duration * PX - 2,
                          borderRadius: 5, padding: "3px 7px", overflow: "hidden", zIndex: 6,
                          border: `2px dashed ${drag.valid ? colorOf(dragged).bg : C.danger}`,
                          background: drag.valid ? colorOf(dragged).soft : C.dangerSoft,
                          color: drag.valid ? (isPause(dragged) ? C.muted : colorOf(dragged).bg) : C.danger,
                        }}
                      >
                        <div style={{ fontSize: 12, fontWeight: 600, lineHeight: 1.2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                          {drag.valid
                            ? `${drag.preferred ? "★ " : ""}${dragged.name}${drag.overlapWith && drag.overlapWith.length ? ` · Gruppe (${drag.overlapWith[0].mins} min)` : ""}`
                            : drag.reason}
                        </div>
                        <div style={{ fontSize: 10, fontFamily: MONO, lineHeight: 1.2 }}>{fmt(drag.start)}–{fmt(drag.start + dragged.duration)}</div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
          <p style={{ fontSize: 12, color: C.muted, margin: "10px 2px 0" }}>
            SchülerInnen und Pausen aus der Liste in den Plan ziehen. Über <span aria-hidden>▾</span> pro SchülerIn Sperr- und Wunschzeiten festlegen. Raster: 5 Minuten.
            {settings.maxOverlap > 0 && ` · Bis zu ${settings.maxOverlap} min Überlappung als Gruppenunterricht möglich.`}
          </p>
        </main>
      </div>

      {drag && drag.day === null && dragged && (
        <div style={{ position: "fixed", left: drag.x + 12, top: drag.y + 12, pointerEvents: "none", zIndex: 50, background: drag.fromGrid ? C.dangerSoft : colorOf(dragged).bg, color: drag.fromGrid ? C.danger : "#fff", border: drag.fromGrid ? `1px solid ${C.danger}` : "none", padding: "5px 10px", borderRadius: 6, fontSize: 12, fontWeight: 600, boxShadow: "0 2px 8px rgba(0,0,0,.2)", whiteSpace: "nowrap" }}>
          {drag.fromGrid ? `${dragged.name} aus dem Plan nehmen` : `${dragged.name} · ${dragged.duration} min`}
        </div>
      )}

      {exportText && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(30,40,55,0.5)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={() => setExportText(null)}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: C.paper, border: `1px solid ${C.border}`, borderRadius: 10, padding: 18, maxWidth: 560, width: "100%", maxHeight: "80vh", display: "flex", flexDirection: "column" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
              <h2 style={{ fontFamily: SERIF, fontStyle: "italic", fontWeight: 400, margin: 0, fontSize: 20 }}>
                {exportText.kind === "ics" ? "Kalender-Datei" : "Export"}
              </h2>
              <button onClick={() => setExportText(null)} className="sp-x" style={{ fontSize: 20 }}>×</button>
            </div>
            <p style={{ fontSize: 12, color: C.muted, margin: "0 0 10px" }}>
              Kopiere den Text und speichere ihn als <code style={{ fontFamily: MONO }}>{exportText.filename}</code>
              {exportText.kind === "ics" ? " zum Import in Google Kalender." : "."}
            </p>
            <textarea readOnly value={exportText.text} style={{ flex: 1, minHeight: 200, fontFamily: MONO, fontSize: 11, padding: 8, border: `1px solid ${C.border}`, borderRadius: 5, resize: "vertical", background: "#F7F7F5" }} onFocus={(e) => e.target.select()} />
            <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
              <button className="sp-btn" onClick={copyToClipboard} style={{ fontWeight: 600 }}>{exportText.copied ? "Kopiert ✓" : "In Zwischenablage kopieren"}</button>
              <button className="sp-btn" onClick={() => setExportText(null)}>Schließen</button>
            </div>
          </div>
        </div>
      )}
      {blockHover && !drag && (() => {
        const hs = items.find((x) => x.id === blockHover.id);
        if (!hs || hs.type !== "student") return null;
        return (
          <div className="sp-block-popup" style={{ left: blockHover.x, top: blockHover.y }}>
            <div style={{ fontFamily: SERIF, fontStyle: "italic", fontWeight: 400, fontSize: 16, marginBottom: 6 }}>{hs.name}</div>
            <div style={{ fontSize: 11, color: C.muted, marginBottom: 8 }}>
              <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 2, background: colorOf(hs).bg, marginRight: 5, verticalAlign: "middle" }} />
              {hs.duration} min Unterrichtseinheit
            </div>
            {hs.day !== null ? (
              <div style={{ marginBottom: 4 }}>
                <span style={{ color: C.muted }}>Termin: </span>
                <span style={{ fontFamily: MONO, fontVariantNumeric: "tabular-nums" }}>{DAY_NAMES[hs.day]} {fmt(hs.start)}–{fmt(hs.start + hs.duration)}</span>
              </div>
            ) : (
              <div style={{ marginBottom: 4, fontStyle: "italic", color: C.muted }}>Noch nicht eingeplant</div>
            )}
            {hs.lernjahr && (
              <div style={{ marginBottom: 2 }}>
                <span style={{ color: C.muted }}>Lernjahr: </span>{hs.lernjahr}
              </div>
            )}
            {hs.schulstufe && (
              <div style={{ marginBottom: 2 }}>
                <span style={{ color: C.muted }}>Schulstufe: </span>{hs.schulstufe}
                {hs.schulstufeSince && (
                  <span style={{ color: C.muted, fontSize: 11 }}> seit {formatGermanDate(hs.schulstufeSince)}</span>
                )}
              </div>
            )}
            {((hs.blocked || []).length > 0 || (hs.preferred || []).length > 0) && (
              <div style={{ fontSize: 11, color: C.muted, marginTop: 8, paddingTop: 6, borderTop: `1px solid ${C.line10}` }}>
                {(hs.blocked || []).length > 0 && <div>{(hs.blocked || []).length} Sperrzeit{(hs.blocked || []).length === 1 ? "" : "en"}</div>}
                {(hs.preferred || []).length > 0 && <div>{(hs.preferred || []).length} Wunschzeit{(hs.preferred || []).length === 1 ? "" : "en"}</div>}
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}

function TimePicker({ mins, onChange, startHour, endHour }) {
  const clamped = Math.max(startHour * 60, Math.min(endHour * 60, mins));
  const h = Math.floor(clamped / 60);
  const m = clamped % 60;
  const hours = [];
  for (let i = startHour; i <= endHour; i++) hours.push(i);
  const minutes = [];
  for (let i = 0; i < 60; i += 5) minutes.push(i);
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 1 }}>
      <select value={h} onChange={(e) => onChange(+e.target.value * 60 + m)} className="sp-tp" aria-label="Stunde">
        {hours.map((hh) => <option key={hh} value={hh}>{String(hh).padStart(2, "0")}</option>)}
      </select>
      <span style={{ fontFamily: MONO, color: C.muted, fontSize: 12, padding: "0 1px" }}>:</span>
      <select value={m} onChange={(e) => onChange(h * 60 + +e.target.value)} className="sp-tp" aria-label="Minute">
        {minutes.map((mm) => <option key={mm} value={mm}>{String(mm).padStart(2, "0")}</option>)}
      </select>
    </span>
  );
}

function DateInput({ value, onChange, style, className, ...rest }) {
  const displayValue = value ? formatGermanDate(value) : "";
  const [text, setText] = useState(displayValue);

  useEffect(() => { setText(displayValue); }, [displayValue]);

  const commit = (t) => {
    if (!t.trim()) { onChange(""); setText(""); return; }
    const m = t.match(/^\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})\s*$/);
    if (m) {
      let year = m[3];
      if (year.length === 2) year = "20" + year;
      const day = m[1].padStart(2, "0");
      const month = m[2].padStart(2, "0");
      const ymd = `${year}-${month}-${day}`;
      if (parseYmd(ymd)) {
        onChange(ymd);
        setText(formatGermanDate(ymd));
        return;
      }
    }
    setText(displayValue);
  };

  return (
    <input
      type="text"
      value={text}
      onChange={(e) => setText(e.target.value)}
      onBlur={(e) => commit(e.target.value)}
      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); commit(e.currentTarget.value); } }}
      placeholder="TT.MM.JJJJ"
      inputMode="numeric"
      style={style}
      className={className}
      {...rest}
    />
  );
}

function AvailEditor({ s, addAvail, removeAvail, update, visibleDays, startHour, endHour }) {
  const [tab, setTab] = useState("blocked");
  const [day, setDay] = useState(visibleDays[0] != null ? visibleDays[0] : 0);
  const [from, setFrom] = useState(startHour * 60);
  const [to, setTo] = useState(Math.min((startHour + 1) * 60, endHour * 60));
  const [err, setErr] = useState("");

  useEffect(() => {
    if (visibleDays.length && !visibleDays.includes(day)) setDay(visibleDays[0]);
  }, [visibleDays, day]);

  useEffect(() => {
    const sMin = startHour * 60, eMin = endHour * 60;
    setFrom((f) => Math.max(sMin, Math.min(eMin - 5, f - (f % 5))));
    setTo((t) => Math.max(sMin + 5, Math.min(eMin, t - (t % 5))));
  }, [startHour, endHour]);

  const list = tab === "blocked" ? (s.blocked || []) : (s.preferred || []);
  const isBlk = tab === "blocked";
  const accent = isBlk ? C.danger : PREF.bg;
  const accentSoft = isBlk ? C.dangerSoft : PREF.soft;

  const submit = () => {
    if (from >= to) { setErr("Endzeit muss nach der Startzeit liegen"); return; }
    setErr("");
    addAvail(s.id, tab, day, from, to);
  };

  const setLernjahr = (v) => update(s.id, { lernjahr: v === "" ? null : Math.max(1, Math.min(30, +v)) });
  const setSchulstufe = (v) => update(s.id, { schulstufe: v === "" ? null : Math.max(1, Math.min(13, +v)) });
  const setSchulstufeSince = (v) => update(s.id, { schulstufeSince: v || null });

  return (
    <div
      onPointerDown={(e) => e.stopPropagation()}
      style={{ background: "#F7F7F5", border: `1px solid ${C.border}`, borderTop: "none", borderRadius: "0 0 8px 8px", padding: 10 }}
    >
      {/* SchülerIn-Info */}
      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: C.muted, marginBottom: 6 }}>
        SchülerIn-Info
      </div>
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6, fontSize: 12, flexWrap: "wrap" }}>
        <span>Lernjahr</span>
        <input
          type="number" min={1} max={30}
          value={s.lernjahr != null ? s.lernjahr : ""}
          onChange={(e) => setLernjahr(e.target.value)}
          className="sp-av-input"
          style={{ width: 50, fontSize: 12 }}
          aria-label="Lernjahr"
        />
        <span style={{ marginLeft: 4 }}>Schulstufe</span>
        <input
          type="number" min={1} max={13}
          value={s.schulstufe != null ? s.schulstufe : ""}
          onChange={(e) => setSchulstufe(e.target.value)}
          className="sp-av-input"
          style={{ width: 50, fontSize: 12 }}
          aria-label="Schulstufe"
        />
      </div>
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 12, fontSize: 12 }}>
        <span>Stufe seit</span>
        <DateInput
          value={s.schulstufeSince || ""}
          onChange={setSchulstufeSince}
          className="sp-av-input"
          style={{ fontSize: 12, flex: 1, fontFamily: MONO, fontVariantNumeric: "tabular-nums" }}
          aria-label="In aktueller Schulstufe seit"
        />
      </div>

      {/* Reiter */}
      <div style={{ display: "flex", gap: 4, marginBottom: 8 }}>
        {[
          { id: "blocked", label: "Sperrzeiten", color: C.danger, count: (s.blocked || []).length },
          { id: "preferred", label: "Wunschzeiten", color: PREF.bg, count: (s.preferred || []).length },
        ].map((t) => {
          const active = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => { setTab(t.id); setErr(""); }}
              style={{
                flex: 1,
                border: `1px solid ${active ? t.color : C.border}`,
                background: active ? t.color : C.paper,
                color: active ? "#fff" : C.ink,
                borderRadius: 5, padding: "5px 8px", fontSize: 12, fontWeight: 600,
                cursor: "pointer", fontFamily: "inherit",
              }}
            >
              {t.label} · {t.count}
            </button>
          );
        })}
      </div>

      {list.length === 0 ? (
        <div style={{ fontSize: 12, color: C.muted, padding: "2px 0 8px" }}>
          {isBlk ? "Keine Sperrzeiten" : "Keine Wunschzeiten"}
        </div>
      ) : (
        <div style={{ marginBottom: 8 }}>
          {list.map((e, idx) => (
            <div key={idx} style={{
              display: "flex", alignItems: "center", gap: 6,
              padding: "3px 8px", background: accentSoft, color: accent,
              borderRadius: 4, marginBottom: 3, fontSize: 12,
            }}>
              <span style={{ flex: 1, fontFamily: MONO, fontVariantNumeric: "tabular-nums" }}>
                {DAY_SHORT[e.day]} · {fmt(e.from)}–{fmt(e.to)}
              </span>
              <button
                onClick={() => removeAvail(s.id, tab, idx)}
                aria-label="Entfernen"
                style={{ border: "none", background: "none", color: accent, cursor: "pointer", padding: "0 4px", fontSize: 15, lineHeight: 1 }}
              >×</button>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
        <select value={day} onChange={(e) => setDay(+e.target.value)} className="sp-av-input" aria-label="Wochentag">
          {visibleDays.map((i) => <option key={i} value={i}>{DAY_SHORT[i]}</option>)}
        </select>
        <TimePicker mins={from} onChange={(v) => { setFrom(v); setErr(""); }} startHour={startHour} endHour={endHour} />
        <span style={{ color: C.muted, fontSize: 12 }}>–</span>
        <TimePicker mins={to} onChange={(v) => { setTo(v); setErr(""); }} startHour={startHour} endHour={endHour} />
        <button
          onClick={submit}
          style={{
            border: `1px solid ${accent}`, background: accent, color: "#fff",
            borderRadius: 5, padding: "4px 12px", fontSize: 13, fontWeight: 600,
            cursor: "pointer", fontFamily: "inherit", marginLeft: "auto",
          }}
          title={isBlk ? "Sperrzeit hinzufügen" : "Wunschzeit hinzufügen"}
        >Hinzufügen</button>
      </div>
      {err && <div style={{ fontSize: 11, color: C.danger, marginTop: 6 }}>{err}</div>}
    </div>
  );
}

function EnsembleEditor({ s, allStudents, updateMembers, addDate, removeDate }) {
  const [datePick, setDatePick] = useState("");
  const [err, setErr] = useState("");
  const members = s.members || [];
  const dates = (s.dates || []).slice().sort();

  const toggleMember = (studentId) => {
    const newMembers = members.includes(studentId)
      ? members.filter((m) => m !== studentId)
      : [...members, studentId];
    updateMembers(s.id, newMembers);
  };

  const submitDate = () => {
    if (!datePick) { setErr("Bitte ein Datum wählen"); return; }
    if (dates.includes(datePick)) { setErr("Dieser Termin ist bereits eingetragen"); return; }
    setErr("");
    addDate(s.id, datePick);
    setDatePick("");
  };

  return (
    <div
      onPointerDown={(e) => e.stopPropagation()}
      style={{ background: "#F7F7F5", border: `1px solid ${C.border}`, borderTop: "none", borderRadius: "0 0 8px 8px", padding: 10 }}
    >
      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: C.muted, marginBottom: 6 }}>
        Mitglieder · {members.length}
      </div>
      {allStudents.length === 0 ? (
        <div style={{ fontSize: 12, color: C.muted, padding: "2px 0 10px" }}>
          Noch keine SchülerInnen zum Zuweisen.
        </div>
      ) : (
        <div style={{ marginBottom: 10, maxHeight: 160, overflowY: "auto", border: `1px solid ${C.border}`, borderRadius: 5, background: C.paper }}>
          {allStudents.map((st) => (
            <label key={st.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 6px", fontSize: 12, cursor: "pointer", borderBottom: `1px solid ${C.line10}` }}>
              <input type="checkbox" checked={members.includes(st.id)} onChange={() => toggleMember(st.id)} />
              <span style={{ width: 8, height: 8, borderRadius: 2, background: colorOf(st).bg, flexShrink: 0 }} />
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{st.name}</span>
              <span style={{ fontSize: 10, color: C.muted, fontFamily: MONO }}>{st.duration}m</span>
            </label>
          ))}
        </div>
      )}

      <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: C.muted, marginBottom: 6 }}>
        Konkrete Termine · {dates.length}
      </div>
      {dates.length === 0 ? (
        <div style={{ fontSize: 12, color: C.muted, padding: "2px 0 8px" }}>Noch keine Termine geplant</div>
      ) : (
        <div style={{ marginBottom: 8, maxHeight: 140, overflowY: "auto" }}>
          {dates.map((d) => (
            <div key={d} style={{
              display: "flex", alignItems: "center", gap: 6,
              padding: "3px 8px", background: ENSEMBLE.soft, color: ENSEMBLE.bg,
              borderRadius: 4, marginBottom: 3, fontSize: 12,
            }}>
              <span style={{ flex: 1, fontFamily: MONO, fontVariantNumeric: "tabular-nums" }}>
                {formatGermanDate(d)}
              </span>
              <button
                onClick={() => removeDate(s.id, d)}
                aria-label="Termin entfernen"
                style={{ border: "none", background: "none", color: ENSEMBLE.bg, cursor: "pointer", padding: "0 4px", fontSize: 15, lineHeight: 1 }}
              >×</button>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
        <DateInput
          value={datePick}
          onChange={(v) => { setDatePick(v); setErr(""); }}
          className="sp-av-input"
          style={{ flex: 1, fontSize: 12, fontFamily: MONO, fontVariantNumeric: "tabular-nums" }}
          aria-label="Neues Termin-Datum"
        />
        <button
          onClick={submitDate}
          style={{
            border: `1px solid ${ENSEMBLE.bg}`, background: ENSEMBLE.bg, color: "#fff",
            borderRadius: 5, padding: "4px 12px", fontSize: 13, fontWeight: 600,
            cursor: "pointer", fontFamily: "inherit",
          }}
          title="Termin hinzufügen"
        >Hinzufügen</button>
      </div>
      {err && <div style={{ fontSize: 11, color: C.danger, marginTop: 6 }}>{err}</div>}
    </div>
  );
}

function ItemControls({ s, onDur, confirmDel, setConfirmDel, onDelete, onUnschedule }) {
  const stop = { onPointerDown: (e) => e.stopPropagation() };
  const durs = isPause(s) ? PAUSE_DURS : (isEnsemble(s) ? ENSEMBLE_DURS : STUDENT_DURS);
  if (confirmDel === s.id) {
    return (
      <span style={{ display: "flex", gap: 4, alignItems: "center", fontSize: 12 }} {...stop}>
        <button className="sp-btn" style={{ color: C.danger, padding: "3px 7px", fontSize: 12 }} onClick={onDelete}>Löschen</button>
        <button className="sp-btn" style={{ padding: "3px 7px", fontSize: 12 }} onClick={() => setConfirmDel(null)}>Nein</button>
      </span>
    );
  }
  return (
    <span style={{ display: "flex", gap: 4, alignItems: "center" }} {...stop}>
      <select className="sp-sel" value={s.duration} onChange={(e) => onDur(s, +e.target.value)} aria-label="Dauer">
        {durs.map((d) => <option key={d} value={d}>{d} min</option>)}
      </select>
      {onUnschedule && (
        <button className="sp-x" title="Aus dem Plan nehmen" aria-label="Aus dem Plan nehmen" onClick={onUnschedule} style={{ fontSize: 13 }}>↩</button>
      )}
      <button className="sp-x" title="Löschen" aria-label="Löschen" onClick={() => setConfirmDel(s.id)}>×</button>
    </span>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(Stundenplan));
</script>
